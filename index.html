<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>澄蓝训练</title><style>
:root{--b:#167dbe;--i:#17344b;--m:#668095;--l:#d7e8f4;--bg:#f3f9fe}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.5 system-ui,-apple-system,"PingFang SC";color:var(--i)}button,input{font:inherit}button{cursor:pointer}.app{max-width:680px;margin:auto;padding:14px 14px 40px}.hero,.card{background:#fff;border:1px solid var(--l);box-shadow:0 10px 28px #3c87b018;border-radius:22px}.hero{padding:18px;background:linear-gradient(135deg,#e8f7ff,#fff)}h1{font-size:28px;margin:0}h2{font-size:18px;margin:0 0 4px}.sub,.muted{color:var(--m);font-size:13px;margin:4px 0}.art{height:82px;border-radius:16px;margin-top:12px;background:radial-gradient(circle at 18% 25%,#8fdaff 0 10%,transparent 11%),radial-gradient(circle at 72% 70%,#589ad2 0 16%,transparent 17%),linear-gradient(135deg,#d8f4ff,#b6dfff);position:relative}.art:after{content:"原创几何装饰 · 非教学图";position:absolute;right:8px;bottom:5px;background:#ffffffa8;border-radius:9px;padding:2px 6px;font-size:11px;color:#47718d}.tabs,.filters,.actions{display:flex;gap:8px;overflow:auto;padding:12px 0}.tabs button,.filters button,.actions button,.back{white-space:nowrap;border:1px solid var(--l);background:#fff;color:#176594;border-radius:13px;padding:9px 12px;text-decoration:none}.tabs .on,.primary{background:var(--b)!important;color:#fff!important;border-color:var(--b)!important}.search{width:100%;border:1px solid var(--l);padding:11px 13px;border-radius:14px;background:#fff}.card{padding:15px;margin:10px 0}.tag{display:inline-block;background:#e9f6ff;color:#207cad;padding:3px 8px;border-radius:99px;font-size:12px;margin:7px 5px 0 0}.plan{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid #e4eff7}.small{width:52px;border:1px solid var(--l);border-radius:8px;padding:5px}.timer{text-align:center;font-size:52px;font-variant-numeric:tabular-nums;color:#126fa9;margin:8px}.notice{font-size:12px;color:var(--m);padding:10px 4px}
</style><main class="app" id="app"></main><script>
const A=[['bench','杠铃卧推','胸','训练','杠铃','凯圣王-谭成义三分化②——跟练胸肩三头','bilibili://video/116435959420113?page=0&start_progress=100000','课程定位 01:40；组次数标签 15/12/10/8，总组数未确认。'],['incline','哑铃上斜卧推','胸','训练','哑铃','凯圣王-谭成义三分化②——跟练胸肩三头','bilibili://video/116435959420113?page=0&start_progress=1651000','课程定位 27:31；约12次，总组数未明。'],['dip','双杠臂屈伸（含退阶）','胸','训练','双杠','凯圣王-谭成义三分化②——跟练胸肩三头','bilibili://video/116435959420113?page=0','课程含退阶；具体做法请看原视频。'],['y','Y字侧平举','肩','训练','绳索','凯圣王-谭成义三分化②——跟练胸肩三头','bilibili://video/116435959420113?page=0','未记录单独时间点。'],['s','肩部动作讲解（具体动作待打开原片确认）','肩','学习','不限','谭成义私教系列-肩（精简版）','bilibili://video/116765715601071?page=0','具体动作需打开原片确认。'],['bw','背部热身动作（标题未列具体动作）','背','热身','不限','背部训练先从热身激活开始','bilibili://video/115341850057826?page=0','动作顺序、要点和时间点均未记录。'],['b','背部、三角肌后束、二头肌跟练（课程主题）','背','训练','器械','凯圣王-谭成义三分化④——跟练背三角肌后束二头','bilibili://video/116447049226152?page=0','标题未提供单动作清单。'],['bw2','谭成义自用的背部热身动作（标题级）','背','热身','不限','谭成义自用的背部热身动作','bilibili://video/115880667124445?page=0','未读到完整简介或字幕。'],['l','股四头肌、腘绳肌跟练（课程主题）','腿','训练','器械','凯圣王-谭成义三分化⑤——跟练腿股四头肌腘绳肌','bilibili://video/116471191574369?page=0','未记录单动作列表或时间点。'],['r','罗马尼亚硬拉','腿','训练','杠铃','透视学动作③——罗马尼亚硬拉详解','bilibili://video/115978847392380?page=0','未记录具体时间点。']].map(([id,n,p,role,g,src,url,note])=>({id,n,p,role,g,src,url,note}));
let S={v:'lib',q:'',p:'全部',g:'全部',d:null,plan:JSON.parse(localStorage.getItem('fitness-plan-v2')||'[]'),run:0,left:60,rest:60,pause:true};const app=document.querySelector('#app'),save=()=>localStorage.setItem('fitness-plan-v2',JSON.stringify(S.plan));function C(x){return `<article class=card><h2>${x.n}</h2><span class=tag>${x.p}</span><span class=tag>${x.role}</span><span class=tag>${x.g}</span><p class=muted>${x.src}</p><div class=actions><button data-d=${x.id}>详情</button>${x.role==='学习'?'':`<button data-a=${x.id}>加入计划</button>`}</div></article>`}function draw(){let o=`<section class=hero><h1>澄蓝训练</h1><p class=sub>动作库 · 本地计划 · 专注执行</p><div class=art></div></section><nav class=tabs>${[['lib','动作库'],['rec','推荐'],['plan','训练计划'],['run','执行']].map(x=>`<button class="${S.v===x[0]?'on':''}" data-v=${x[0]}>${x[1]}</button>`).join('')}</nav>`;if(S.v==='lib'){let a=A.filter(x=>(S.p==='全部'||x.p===S.p)&&(S.g==='全部'||x.g===S.g)&&JSON.stringify(x).toLowerCase().includes(S.q.toLowerCase()));o+=`<input class=search id=q value="${S.q}" placeholder="搜索动作或课程"><div class=filters>${['全部','胸','肩','背','腿'].map(x=>`<button data-p=${x}>${x}</button>`).join('')}</div><div class=filters>${['全部','杠铃','哑铃','器械','不限'].map(x=>`<button data-g=${x}>${x}</button>`).join('')}<button id=reset>重置</button></div>${a.map(C).join('')||'<article class=card>没有符合条件的动作。</article>'}`}else if(S.v==='rec'){let a=A.filter(x=>x.role!=='学习'&&(x.role==='热身'||S.g==='全部'||x.g===S.g));o+=`<article class=card><h2>本地规则推荐</h2><p class=muted>先排热身，再按器械筛选；同槽退阶在现有数据中不可靠识别，因此不叠加。</p></article>${a.map(C).join('')}`}else if(S.v==='plan'){o+=`<article class=card><h2>可编辑训练计划</h2><p class=muted>保存在本机浏览器。</p>${S.plan.map((x,i)=>`<div class=plan><div><b>${x.n}</b><br><input class=small data-f=sets data-i=${i} value=${x.sets}>组 × <input class=small data-f=reps data-i=${i} value=${x.reps}>次 · <input class=small data-f=rest data-i=${i} value=${x.rest}>秒</div><div><button data-u=${i}>↑</button><button data-o=${i}>↓</button><button data-x=${i}>删</button></div></div>`).join('')||'<p>从动作库加入动作。</p>'}</article>`}else if(S.v==='run'){let x=S.plan[S.run];o+=x?`<article class=card><p class=muted>${S.run+1}/${S.plan.length}</p><h2>${x.n}</h2><p>${x.sets}组 × ${x.reps}次</p><div class=actions><button class=primary id=done>完成一组</button><button id=next>下一动作</button></div></article><article class=card><div class=timer>${String(S.left/60|0).padStart(2,'0')}:${String(S.left%60).padStart(2,'0')}</div><div class=actions>${[30,60,90,120].map(n=>`<button data-r=${n}>${n}秒</button>`).join('')}</div><button id=pause>${S.pause?'开始':'暂停'}</button> <button id=treset>重置</button></article>`:'<article class=card>训练计划为空。</article>'}else{let x=A.find(x=>x.id===S.d);o+=`<button class=back id=back>← 动作库</button><article class=card><h2>${x.n}</h2><p class=muted>${x.src}</p><p>${x.note}</p><a class="back primary" href="${x.url}">用 B站 App 打开</a></article>`}app.innerHTML=o+'<p class=notice>基于仓库现有 10 张卡片。来源只在详情显示；无字段不补造。</p>'}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.v)S.v=d.v;if(d.p)S.p=d.p;if(d.g)S.g=d.g;if(d.d){S.d=d.d;S.v='detail'}if(d.a){let x=A.find(x=>x.id===d.a);S.plan.push({...x,sets:3,reps:10,rest:60});save()}if(d.x!==undefined){S.plan.splice(+d.x,1);save()}if(d.u&&+d.u){let i=+d.u;[S.plan[i-1],S.plan[i]]=[S.plan[i],S.plan[i-1]];save()}if(d.o!==undefined&&+d.o<S.plan.length-1){let i=+d.o;[S.plan[i+1],S.plan[i]]=[S.plan[i],S.plan[i+1]];save()}if(d.r){S.rest=S.left=+d.r;S.pause=false}if(b.id==='back')S.v='lib';if(b.id==='reset')S.q='',S.p=S.g='全部';if(b.id==='pause')S.pause=!S.pause;if(b.id==='treset')S.left=S.rest,S.pause=true;if(b.id==='done')S.left=S.rest,S.pause=false;if(b.id==='next')S.run=Math.min(S.run+1,S.plan.length-1);draw()});document.addEventListener('input',e=>{if(e.target.id==='q')S.q=e.target.value,draw();if(e.target.dataset.f){S.plan[+e.target.dataset.i][e.target.dataset.f]=+e.target.value||0;save()}});setInterval(()=>{if(S.v==='run'&&!S.pause&&S.left)S.left--,draw()},1000);draw();
</script>
