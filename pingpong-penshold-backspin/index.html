<title>澄蓝训练｜右手直板下旋发球</title>
<style>
:root{--ink:#12354c;--muted:#5e7d91;--line:#cfe7f4;--blue:#168bc6;--deep:#086090;--wash:#edf9ff;--shadow:0 12px 28px rgba(20,109,150,.1);--good:#12744f;--warn:#a85b10}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(135deg,#f8fdff,#e8f7ff 52%,#f9fcff);color:var(--ink);font:16px/1.58 ui-rounded,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:var(--deep)}#app{max-width:1060px;margin:auto;padding:22px}.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:34px}.side{position:sticky;top:18px;align-self:start}.brand{font-size:22px;font-weight:780;letter-spacing:-.05em}.brand span{display:block;font-size:12px;letter-spacing:0;color:var(--muted);margin-top:4px}.nav{display:grid;gap:4px;margin-top:26px}.nav a{padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--muted)}.nav a.on,.nav a:hover{color:var(--deep);background:#dff3fd;font-weight:700}.hero{padding:24px 0 18px;border-bottom:1px solid var(--line)}.hero h1{margin:0;font-size:clamp(30px,4vw,46px);letter-spacing:-.07em;line-height:1.08}.hero p{max-width:700px;margin:12px 0 0;color:var(--muted)}.accent{font-size:14px;color:var(--deep);font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:22px 0}.card{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 7px;letter-spacing:-.035em}.card p{margin:7px 0}.primary,.secondary,.chip{display:inline-flex;align-items:center;justify-content:center;min-height:42px;border-radius:10px;padding:8px 13px;border:1px solid var(--line);text-decoration:none;background:#fff;color:var(--deep)}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.primary:disabled{opacity:.48;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tools{margin-top:24px}.tag{display:inline-block;border-radius:99px;background:#e9f7fd;color:var(--deep);padding:2px 8px;font-size:12px;margin-right:5px}.muted{color:var(--muted);font-size:14px}.note{border-left:4px solid var(--blue);background:#f1faff;padding:11px 13px;border-radius:0 10px 10px 0}.warn{border-left-color:#e89932;background:#fff8ee}.ok{color:var(--good);font-weight:700}.steps{display:grid;gap:10px}.step{display:grid;grid-template-columns:31px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.step:last-child{border:0}.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#dff3fd;color:var(--deep);font-weight:800}.step h3{margin:2px 0 2px}.step p{margin:0;color:var(--muted)}details{border-top:1px solid var(--line);padding:14px 0}details:last-child{border-bottom:1px solid var(--line)}summary{cursor:pointer;font-weight:700;color:var(--deep)}details[open] summary{margin-bottom:9px}.diagram{width:100%;max-height:290px;background:linear-gradient(135deg,#f7fdff,#e1f4ff);border-radius:14px;border:1px solid var(--line);margin:12px 0}.diagram text{font-family:ui-rounded,"PingFang SC",sans-serif;fill:#12354c;font-size:14px}.split{display:grid;grid-template-columns:1.08fr .92fr;gap:14px}.record{display:flex;align-items:end;gap:8px;flex-wrap:wrap}.record input{width:88px;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px}.stat{font-size:31px;font-weight:780;letter-spacing:-.06em;color:var(--deep);line-height:1}.progress{height:8px;background:#d9edf7;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--blue);transition:width .2s}.session{font-size:42px;font-weight:780;letter-spacing:-.07em;color:var(--deep);margin:12px 0 4px}.timer-state{min-height:26px;color:var(--muted)}.phase{display:flex;gap:7px;flex-wrap:wrap}.phase .tag{background:#f3f9fc}.phase .tag.on{background:#168bc6;color:white}.source-list{padding-left:20px}.source-list li{margin:8px 0}.footer{margin:32px 0 12px;color:var(--muted);font-size:13px}@media(max-width:720px){#app{padding:14px}.shell{display:block}.side{position:static;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}.brand span{display:none}.nav{display:flex;margin:0;gap:2px}.nav a{padding:7px 8px;font-size:13px}.hero{padding-top:24px}.grid,.split{grid-template-columns:1fr}.card{padding:16px}.diagram{max-height:none}.session{font-size:38px}}
</style>

<body><main id="app"></main>
<script>
const KEY='chenglan-pingpong-penshold-backspin-v1';
const sources={marin:'https://www.bilibili.com/video/BV1fW411A7Pd/',marinP1:'https://www.bilibili.com/video/BV1fW411A7Pd/?p=1&t=220',marinP2:'https://www.bilibili.com/video/BV1fW411A7Pd/?p=2&t=223',zhang:'https://www.bilibili.com/video/BV14p4y1i7y5/',wudi:'https://www.bilibili.com/video/BV1oW411Z7Fq/',ittf:'https://db.ittf.com/sites/default/files/public/2026-02/2026_Statutes_v1_consolidated_clean.pdf'};
const initial={sets:[],timer:{running:false,remaining:1200,stamp:0}};
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&typeof x==='object'?{...initial,...x,timer:{...initial.timer,...x.timer},sets:Array.isArray(x.sets)?x.sets:[]}:structuredClone(initial)}catch{return structuredClone(initial)}}
let state=load(),tick=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function fmt(s){s=Math.max(0,Math.ceil(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function diagram(){return `<svg class="diagram" viewBox="0 0 620 290" role="img" aria-label="短发球落点俯视示意，非比例动作图"><rect x="72" y="42" width="476" height="205" rx="5" fill="#e7f6ff" stroke="#086090" stroke-width="3"/><path d="M310 42V247" stroke="#086090" stroke-width="5"/><path d="M72 145H548" stroke="#168bc6" stroke-width="4"/><path d="M72 51H548M72 238H548" stroke="#5e7d91" stroke-width="3" stroke-dasharray="7 5"/><circle cx="183" cy="114" r="9" fill="#168bc6"/><circle cx="405" cy="169" r="9" fill="#168bc6"/><circle cx="465" cy="191" r="9" fill="#e89932"/><path d="M183 114C270 123 344 148 405 169S447 185 465 191" fill="none" stroke="#168bc6" stroke-width="3" stroke-dasharray="8 6"/><text x="112" y="32">己方台面</text><text x="416" y="32">对方台面</text><text x="285" y="135">球网</text><text x="76" y="275">端线</text><text x="510" y="275">端线</text><text x="129" y="101">① 本方第一次</text><text x="359" y="157">② 对方第一次</text><text x="420" y="218">③ 对方第二次</text><text x="179" y="266">发短球：③ 仍在对方台内</text></svg><p class="muted">落点俯视示意，非比例、非动作轨迹图：这是“先本方一次、再对方第一次；若不接球，对方半台第二次弹跳仍在台内”的判定。</p>`}
function header(){return `<div class="shell"><aside class="side"><div class="brand">澄蓝训练<span>把一个技术点带进每次练习</span></div><nav class="nav"><a class="on" href="#start">开始练</a><a href="#steps">分步</a><a href="#records">记录</a><a href="#timer">20 分钟</a></nav></aside><section>`}
function end(){return `<p class="footer">本页只在这台浏览器保存你的每 10 球记录；不上传、不收集个人数据。内容分层标注，视频入口不会自动播放。</p></section></div>`}
function recordView(){const n=state.sets.length,total=state.sets.reduce((a,x)=>a+x.good,0),attempt=n*10,rate=attempt?Math.round(total/attempt*100):0;return `<article id="records" class="card"><div class="accent">仅本地保存</div><h2>每 10 球简单记录</h2><p class="muted">这里记录的是“短球合格”：先本方一次、再对方第一次；若不接球，对方半台第二次弹跳仍在台内。它不是旋转成功率。</p><div class="split"><div><div class="stat">${total} <small style="font-size:15px;letter-spacing:0">/ ${attempt} 球</small></div><p class="muted">短球合格 ${n} 组 · 当前比例 ${rate}%</p><div class="progress"><i style="width:${rate}%"></i></div></div><form class="record" id="recordForm"><label>本组短球合格<br><input required name="good" type="number" min="0" max="10" inputmode="numeric" placeholder="0–10"></label><button class="primary">记下这一组</button>${n?'<button type="button" class="secondary" id="undo">撤销最后一组</button>':''}</form></div>${n?`<details><summary>查看已记录的各组</summary><p>${state.sets.map((x,i)=>`第 ${i+1} 组：${x.good}/10`).join('　')}</p></details>`:''}</article>`}
const phases=[['热身 / 抛球',120],['基本摩擦',480],['长度校准',300],['纠错 / 复盘',300]],TOTAL=phases.reduce((n,x)=>n+x[1],0);
const TimerCore={phase(remaining){let spent=TOTAL-Math.max(0,Math.min(TOTAL,remaining));for(let i=0;i<phases.length;i++){if(spent<phases[i][1])return i;spent-=phases[i][1]}return phases.length-1},advance(timer,now){const out={...timer};if(!out.running)return out;const elapsed=Math.max(0,(now-out.stamp)/1000);out.remaining=Math.max(0,out.remaining-elapsed);out.stamp=now;if(out.remaining===0)out.running=false;return out},skip(timer){const i=TimerCore.phase(timer.remaining);const spent=phases.slice(0,i+1).reduce((n,x)=>n+x[1],0);return {...timer,remaining:Math.max(0,TOTAL-spent),stamp:timer.stamp}},reset(){return {running:false,remaining:TOTAL,stamp:0}}};
function timerView(){let t=state.timer,i=TimerCore.phase(t.remaining),p=phases[i];return `<article id="timer" class="card"><div class="accent">助手拟定 · 非原视频课表</div><h2>20 分钟自练模式</h2><div class="phase">${phases.map((x,j)=>`<span class="tag ${j===i?'on':''}">${j+1}. ${x[0]} ${fmt(x[1])}</span>`).join('')}</div><div class="session">${fmt(t.remaining)}</div><div class="timer-state">${t.running?'进行中：'+p[0]:(t.remaining?'暂停中：'+p[0]:'已完成 20 分钟')}</div><div class="actions"><button id="timerToggle" class="primary" ${!t.remaining?'disabled':''}>${t.running?'暂停':'开始 / 继续'}</button><button id="timerNext" class="secondary" ${!t.remaining?'disabled':''}>跳到下一段</button><button id="timerReset" class="secondary">重置 20 分钟</button></div><details><summary>每一段做什么</summary><ol><li><b>2 分钟热身 / 抛球：</b>活动手腕与肩；只练合法、稳定的抛球与触球前站定。</li><li><b>8 分钟基本摩擦：</b>按 10 球一组，优先薄擦与低弧线，不追求猛快。</li><li><b>5 分钟长度校准：</b>目标是先本方一次、再对方第一次；若不接球，对方半台第二次弹跳仍在台内。</li><li><b>5 分钟纠错 / 复盘：</b>手机侧后方录几球，看抛球、触球点、拍面与落点；不在本页上传。</li></ol></details></article>`}
function render(){document.querySelector('#app').innerHTML=header()+`<header id="start" class="hero"><div class="accent">右手直板 · 自练入口</div><h1>把下旋发得短、低，先把“薄擦”做稳定。</h1><p>面向右手直板。先从常规正手位下旋开始，不把勾手或逆旋转当主角。视频只作入口；本页没有取得视频字幕，未编造具体分段或教练原话。</p><div class="actions"><a class="primary" href="${sources.zhang}" target="_blank" rel="noopener">打开直板发球主线视频</a><a class="secondary" href="#timer">开始 20 分钟</a></div></header><div class="grid"><article class="card"><span class="tag">核实来源</span><h2>先看视频，再按页练</h2><p>张超《把直板发球精髓告诉你》（精英乒乓网，2020-07-18，约 14:17）是直板主线入口；但本页未取得字幕。</p><a href="${sources.zhang}" target="_blank" rel="noopener">打开 B 站原片</a></article><article class="card"><span class="tag">助手训练建议</span><h2>成功标准先简单</h2><p>每 10 球里，先数“第二跳不出台且自己可重复做出”的球。球回滚不是唯一旋转指标，独练不承诺定量测旋转。</p><a href="#records">记录一组</a></article></div><section id="steps" class="tools"><div class="accent">右手直板基础下旋 · 分步</div><h2>从站位到落点</h2>${diagram()}<div class="steps"><div class="step"><div class="num">1</div><div><h3>站得能向前、也能向下</h3><p>右手持拍，身体放松、重心略低；以你舒适的正手发球位开始。别为了“藏拍”把上身拧死。</p></div></div><div class="step"><div class="num">2</div><div><h3>抛球先合规、再一致</h3><p>球静止在张开手掌上，近垂直无旋抛起至少 16 厘米；下降时击球。球应在台面以上、端线以后，非持拍臂抛球后移开。</p></div></div><div class="step"><div class="num">3</div><div><h3>拍面微开，找球的中下部</h3><p>不是拍面大开“铲”球；先用较薄的接触，让拍子从球的中下部擦过去。触球点以你能稳定摩擦、不过度吃球为准。</p></div></div><div class="step"><div class="num">4</div><div><h3>向前下方薄擦，别托送</h3><p>手腕与前臂协同加速，但幅度从小开始；击球后有向前的出球，也保留下切摩擦。声音、低弧线与第二跳共同观察。</p></div></div><div class="step"><div class="num">5</div><div><h3>先做短，再做变化</h3><p>目标是：先落己方台面，第二跳落在对方半台后不出台。太长时，优先缩短向前推送、把触球做薄；别急着练勾手或逆旋。</p></div></div></div></section><section class="tools"><div class="accent">短下旋练习 · 逐步进阶</div><div class="grid"><article class="card"><h2>A. 只抓摩擦</h2><p>每组 10 球，允许落点还不短。观察能否低、是否常“飘”或撞高。先完成 3 组再往下走。</p></article><article class="card"><h2>B. 加入长度</h2><p>同样 10 球一组，瞄准第二跳不出台。不要通过猛压拍面硬砸短球；先让前送更少、摩擦更干净。</p></article><article class="card"><h2>C. 固定一个落点</h2><p>选对方正手短或中路短之一，连续 3 组。每组只改一个变量：拍面、触球薄厚或前送长度。</p></article><article class="card"><h2>D. 有同伴再复核</h2><p>请同伴正常接发，记录其起板是否容易冒高、是否判断失误。此反馈比自己看球回滚更可靠。</p></article></div></section><section class="tools"><div class="accent">常见错误排查</div><div class="grid"><article class="card"><h2>球太长</h2><p><b>先查：</b>向前送得太多、触球太厚。<br><b>调整：</b>缩小前送，保留薄擦；把目标改为“第二跳不过端线”。</p></article><article class="card"><h2>球像不转、很飘</h2><p><b>先查：</b>拍面在撞球，或击球后托送。<br><b>调整：</b>降低练习速度，找到中下部薄擦；录慢动作看触球。</p></article><article class="card"><h2>经常下网</h2><p><b>先查：</b>拍面过扣、触球过低或只向下。<br><b>调整：</b>拍面稍微打开一点，保留一小段向前出球。</p></article><article class="card"><h2>抛球不稳 / 不合法</h2><p><b>先查：</b>手指拨球、抛球太低或遮挡。<br><b>调整：</b>单独练抛球；每次下降到同一高度再击球。</p></article></div></section>${recordView()}${timerView()}<section class="tools"><div class="accent">内容边界与来源</div><h2>知道什么，没知道什么</h2><details open><summary>核实来源</summary><ul class="source-list"><li><a href="${sources.marin}" target="_blank" rel="noopener">马琳教你学乒乓球（BV1fW411A7Pd）</a>：已核实 P1 直板握拍“手指头决定成败”3:40；P2 提及发球时重心下压、两跳不出台 3:43。未取得字幕。</li><li><a href="${sources.zhang}" target="_blank" rel="noopener">张超把直板发球精髓告诉你（BV14p4y1i7y5）</a>：精英乒乓网，2020-07-18，约 14:17；直板主线来源，未取得字幕。</li><li><a href="${sources.wudi}" target="_blank" rel="noopener">无敌乒乓第 16 集：直板发球不转漏球（BV1oW411Z7Fq）</a>：简介涉及摩擦、拍型、长度纠错；未取得字幕。</li><li><a href="${sources.ittf}" target="_blank" rel="noopener">ITTF Statutes 2026 §2.6</a>：发球规则原文依据。</li></ul></details><details><summary>待核视频字幕</summary><p>以上 B 站页面的标题、分集或简介已经核实；本页没有获得完整可核字幕。因此这里的“分步、练习与纠错”明确是助手训练建议，不归属为任一教练的逐字教学，也不捏造视频时间点。</p></details><details><summary>安全与练习边界</summary><p>若手腕、肘或肩出现疼痛，停止加速挥拍并考虑请专业人士评估。练习应在安全、允许的球台环境进行。</p></details></section>`+end(); bind();}
function canonicalWording(){const changes=[['每 10 球里，先数“第二跳不出台且自己可重复做出”的球。球回滚不是唯一旋转指标，独练不承诺定量测旋转。','每 10 球里，先数“短球合格”：先本方一次、再对方第一次；若不接球，对方半台第二次弹跳仍在台内。单人记录不把它叫旋转成功率。'],['声音、低弧线与第二跳共同观察。','声音与低弧线可作观察，不把它们当旋转量。'],['目标是：先落己方台面，第二跳落在对方半台后不出台。','目标是：先落本方一次、再落对方第一次；若不接球，对方半台第二次弹跳仍在台内。'],['同样 10 球一组，瞄准第二跳不出台。','同样 10 球一组，瞄准“对方半台第二次弹跳仍在台内”。'],['请同伴正常接发，记录其起板是否容易冒高、是否判断失误。此反馈比自己看球回滚更可靠。','请同伴用固定拍型、固定接法接同一落点，再比较不同发球带来的回球；这只是一种反馈，不是旋转量的唯一判断。'],['把目标改为“第二跳不过端线”。','把目标改为“对方半台第二次弹跳仍在台内”。']];const w=document.createTreeWalker(document.querySelector('#app'),NodeFilter.SHOW_TEXT);for(let n;n=w.nextNode();)for(const [a,b]of changes)if(n.nodeValue.includes(a))n.nodeValue=n.nodeValue.replace(a,b)}const firstRender=render;render=function(){firstRender();canonicalWording()};function stopTick(){if(tick)clearInterval(tick);tick=null}function startTick(){if(!tick)tick=setInterval(()=>{syncTimer(Date.now());render()},500)}function syncTimer(now=Date.now()){state.timer=TimerCore.advance(state.timer,now);if(!state.timer.running)stopTick();save()}function bind(){document.querySelector('#recordForm')?.addEventListener('submit',e=>{e.preventDefault();const v=+new FormData(e.target).get('good');if(Number.isInteger(v)&&v>=0&&v<=10){state.sets.push({good:v,at:Date.now()});save();render()}});document.querySelector('#undo')?.addEventListener('click',()=>{state.sets.pop();save();render()});document.querySelector('#timerToggle')?.addEventListener('click',()=>{syncTimer();if(state.timer.remaining){state.timer.running=!state.timer.running;state.timer.stamp=Date.now();if(state.timer.running)startTick();else stopTick()}save();render()});document.querySelector('#timerNext')?.addEventListener('click',()=>{syncTimer();state.timer=TimerCore.skip(state.timer);if(!state.timer.remaining)state.timer.running=false;state.timer.stamp=Date.now();save();render()});document.querySelector('#timerReset')?.addEventListener('click',()=>{state.timer=TimerCore.reset();stopTick();save();render()})}syncTimer();if(state.timer.running)startTick();render();
